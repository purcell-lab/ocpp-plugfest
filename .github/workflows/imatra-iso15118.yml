name: Imatra ISO 15118-2 lab

# Runs Chargetronic's Imatra cloud SECC with its own test layer, test station
# and Josev test EV, end to end, on x86_64 and on arm64 (the HA Green's
# architecture). Both upstream repositories are fetched at pinned commits at
# run time. Nothing from them is copied into this repository: the test harness
# is PolyForm Internal Use 1.0.0 (no distribution).
#
# Evidence only. No Home Assistant, Cloudflare or live charger is touched.

on:
  workflow_dispatch:
    inputs:
      harness_ref:
        description: imatra.test_harness commit (pins its own Imatra commit in contracts/IMATRA_REF)
        default: e1e9dfc522e6b2ca9b83fa7f1150858c9bdd7594
  push:
    branches: [imatra-lab]
    paths: [.github/workflows/imatra-iso15118.yml]

permissions:
  contents: read

concurrency:
  group: imatra-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HARNESS_REF: ${{ inputs.harness_ref || 'e1e9dfc522e6b2ca9b83fa7f1150858c9bdd7594' }}
    steps:
      - name: Fetch the test harness (pinned)
        uses: actions/checkout@v5
        with:
          repository: Chargetronic/imatra.test_harness
          ref: ${{ env.HARNESS_REF }}
          path: harness
          persist-credentials: false

      - name: Fetch Imatra at the harness's pinned commit
        id: ref
        run: echo "imatra=$(cat harness/contracts/IMATRA_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: Chargetronic/imatra.iso15118_server
          ref: ${{ steps.ref.outputs.imatra }}
          path: imatra
          persist-credentials: false

      - name: Host
        run: |
          uname -m; nproc; free -m; docker version --format '{{.Server.Version}}'
          echo "harness $HARNESS_REF"; echo "imatra ${{ steps.ref.outputs.imatra }}"

      - name: Start Imatra and the harness (builds every image)
        run: |
          start=$(date +%s)
          IMATRA_DIR=$GITHUB_WORKSPACE/imatra harness/compose/up.sh
          echo "up_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"

      - name: One ISO 15118-2 session end to end, contracts checked
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra WATCH_S=300 harness/compose/e2e.sh

      - name: "T2: operator current limit and group activation during a session"
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra harness/compose/scenarios.sh t2

      - name: "T6: EV without TLS"
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra harness/compose/scenarios.sh t6

      - name: "T7: negative security checks"
        run: IMATRA_DIR=$GITHUB_WORKSPACE/imatra harness/compose/scenarios.sh t7

      - name: Resource use of the running deployment
        if: always()
        run: |
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' | tee -a "$GITHUB_STEP_SUMMARY"
          docker images --format 'table {{.Repository}}\t{{.Size}}' | grep -i imatra | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Logs
        if: failure()
        run: |
          docker compose -p imatra-harness-server -f imatra/docker-compose.yml --project-directory imatra logs --tail 200 || true
          docker compose -f harness/compose/harness.yml logs --tail 200 station ev layer || true
