<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t">Draft AS 5438: three protocols and timing targets</title><desc id="d">SEP2 via CSIP-AUS and OCPP 2.1 are the primary paths; SunSpec Modbus 1.2 is secondary. Timing targets: 5 s read/write, 30 s active-power limit, 15 s communication-loss fail-safe.</desc><defs><symbol id="i-check" viewBox="0 0 64 64"><path d="M18 33 L28 43 L47 22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></symbol></defs><rect x="1" y="1" width="1278" height="228" rx="24" fill="#fff6e5" stroke="#e7dcc6" stroke-width="2"/><text x="32" y="48" font-size="22" font-weight="800" fill="#1b1b1b" text-anchor="start" letter-spacing="-.4">Draft AS 5438: three protocols an EEMS must support</text><rect x="32" y="70" width="240" height="132" rx="14" fill="#0f6e6e" stroke="#0f6e6e" stroke-width="1.5"/><text x="52" y="110" font-size="24" font-weight="800" fill="#ffffff" text-anchor="start">SEP2</text><text x="52" y="136" font-size="14" font-weight="500" fill="#fff6e5" text-anchor="start">via CSIP-AUS</text><text x="52" y="158" font-size="13" font-weight="400" fill="#fff6e5" text-anchor="start">IEEE 2030.5 · AS 5385:2023</text><rect x="52" y="170" width="104" height="22" rx="11" fill="#d2a55c"/><text x="104.0" y="185.5" font-size="12" font-weight="700" fill="#1b1b1b" text-anchor="middle">Primary path</text><rect x="286" y="70" width="240" height="132" rx="14" fill="#0f6e6e" stroke="#0f6e6e" stroke-width="1.5"/><text x="306" y="110" font-size="24" font-weight="800" fill="#ffffff" text-anchor="start">OCPP 2.1</text><text x="306" y="136" font-size="14" font-weight="500" fill="#fff6e5" text-anchor="start">bidirectional EV charging</text><text x="306" y="158" font-size="13" font-weight="400" fill="#fff6e5" text-anchor="start">SetChargingProfile · TxProfile</text><rect x="306" y="170" width="104" height="22" rx="11" fill="#d2a55c"/><text x="358.0" y="185.5" font-size="12" font-weight="700" fill="#1b1b1b" text-anchor="middle">Primary path</text><rect x="540" y="70" width="240" height="132" rx="14" fill="#ffffff" stroke="#e7dcc6" stroke-width="1.5"/><text x="560" y="110" font-size="19" font-weight="800" fill="#1b1b1b" text-anchor="start">SunSpec Modbus 1.2</text><text x="560" y="136" font-size="14" font-weight="500" fill="#5a5a5a" text-anchor="start">inverters</text><text x="560" y="158" font-size="13" font-weight="400" fill="#5a5a5a" text-anchor="start">hybrid inverter</text><rect x="560" y="170" width="116" height="22" rx="11" fill="#fff6e5"/><text x="618.0" y="185.5" font-size="12" font-weight="700" fill="#5a5a5a" text-anchor="middle">Secondary path</text><rect x="800" y="70" width="448" height="132" rx="14" fill="#ffffff" stroke="#e7dcc6" stroke-width="1.5"/><text x="822" y="102" font-size="14" font-weight="700" fill="#0a4f4f" text-anchor="start">AS 5438 function-map timing targets</text><text x="822.0" y="154" font-size="32" font-weight="800" fill="#1b1b1b" text-anchor="start" letter-spacing="-.8">≤5 s</text><text x="822.0" y="182" font-size="13" font-weight="500" fill="#5a5a5a" text-anchor="start">read / write</text><text x="956.6666666666666" y="154" font-size="32" font-weight="800" fill="#1b1b1b" text-anchor="start" letter-spacing="-.8">≤30 s</text><text x="956.6666666666666" y="182" font-size="13" font-weight="500" fill="#5a5a5a" text-anchor="start">active-power limit</text><text x="1091.3333333333333" y="154" font-size="32" font-weight="800" fill="#1b1b1b" text-anchor="start" letter-spacing="-.8">≤15 s</text><text x="1091.3333333333333" y="182" font-size="13" font-weight="500" fill="#5a5a5a" text-anchor="start">comms-loss fail-safe</text></svg>
