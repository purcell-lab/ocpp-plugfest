<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" width="1280" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title id="t">End-to-end chain with protocol labels</title><desc id="d">Two inputs converge on the Home Assistant EEMS. Network: the network operator's CSIP-AUS server (Cactus) via SEP2/CSIP-AUS to Open Dynamic Export, via MQTT to Home Assistant. Price: an OpenADR 3.1 VTN via OpenADR 3.1 PRICE and EXPORT_PRICE events to Home Assistant (OpenADR VEN). Then via REST to CitrineOS CSMS, via OCPP 2.1 SetChargingProfile to EVerest, then the Plugfest charging stations, via ISO 15118-20 DC_BPT to the EV.</desc><defs><symbol id="i-tower" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 6 L18 58 M32 6 L46 58 M10 18 H54 M16 31 H48 M25.5 18 L39 31 M38.5 18 L25 31 M21.5 45 H42.5 M24.5 31 L42 45 M39.5 31 L22 45 M21.5 45 L46 58 M42.5 45 L18 58"/></g>
